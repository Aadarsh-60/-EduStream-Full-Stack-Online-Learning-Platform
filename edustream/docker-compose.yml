services:

  # ── MongoDB ───────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: edustream-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - edustream-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: edustream-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - edustream-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── RabbitMQ ──────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: edustream-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"       # AMQP port (used by app)
      - "15672:15672"     # Management UI: http://localhost:15672 (guest/guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - edustream-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Backend (Express Monolith) ────────────────────────────────
  backend:
    build:
      context: ./edustream-backend
      dockerfile: Dockerfile
    container_name: edustream-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost

      # MongoDB
      MONGO_URI: mongodb://mongo:27017

      # Redis
      REDIS_URL: redis://redis:6379

      # RabbitMQ
      RABBITMQ_URL: amqp://rabbitmq

      # JWT (override with your secrets!)
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      ACCESS_TOKEN_EXPIRY: 15m
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}

      # Cloudinary
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      # AI
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      # Razorpay
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}

      # Notification Hub
      NOTIFICATION_HUB_API_KEY: ${NOTIFICATION_HUB_API_KEY}
      NOTIFICATION_HUB_API_SECRET: ${NOTIFICATION_HUB_API_SECRET}

      # SMTP
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}

    networks:
      - edustream-net

  # ── Frontend (React/Vite → Nginx) ─────────────────────────────
  frontend:
    build:
      context: ./edustream-frontend
      dockerfile: Dockerfile
      args:
        # Pass at build time so Vite can bake the API URL into the bundle
        VITE_API_URL: ""   # Leave empty — Nginx proxy handles /api routing
    container_name: edustream-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - edustream-net

# ── Named volumes for persistent data ─────────────────────────
volumes:
  mongo_data:
  redis_data:
  rabbitmq_data:

# ── Shared network ─────────────────────────────────────────────
networks:
  edustream-net:
    driver: bridge
