services:
  - type: web
    name: edustream-backend
    env: node
    rootDir: edustream/edustream-backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Make sure to add other environment variables from your .env file in the Render Dashboard:
      # - MONGO_URI
      # - JWT_SECRET
      # - CLIENT_URL
      # - CLOUDINARY_CLOUD_NAME
      # - CLOUDINARY_API_KEY
      # - CLOUDINARY_API_SECRET
      # - RAZORPAY_KEY_ID
      # - RAZORPAY_KEY_SECRET
      # - GEMINI_API_KEY
      # - EMAIL_USER
      # - EMAIL_PASS
