services:

  # ── MongoDB Database ──────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: edustream-mongo
    restart: unless-stopped
    # Isolated inside edustream-net (avoids collision with host MongoDB on port 27017)
    volumes:
      - mongo_data:/data/db
    networks:
      - edustream-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Redis Cache & Rate Limiting ───────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: edustream-redis
    restart: unless-stopped
    # Isolated inside edustream-net (avoids collision with host Redis on port 6379)
    volumes:
      - redis_data:/data
    networks:
      - edustream-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ Event Broker ─────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: edustream-rabbitmq
    restart: unless-stopped
    # AMQP port 5672 is internal to edustream-net (avoids host RabbitMQ collision)
    # Management UI mapped to 15673 to prevent host port collision
    ports:
      - "${RABBITMQ_MGMT_PORT:-15673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - edustream-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Backend Modular Monolith ──────────────────────────────────
  backend:
    build:
      context: ./edustream/edustream-backend
      dockerfile: Dockerfile
    container_name: edustream-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./edustream/edustream-backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:${FRONTEND_PORT:-5173},http://localhost:5173,http://localhost

      # Docker container internal network addresses
      MONGO_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq
    networks:
      - edustream-net

  # ── Frontend (React/Vite served via Nginx) ────────────────────
  frontend:
    build:
      context: ./edustream/edustream-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""   # Empty so Nginx /api reverse proxy routes correctly
    container_name: edustream-frontend
    restart: unless-stopped
    # Port 5173 on host (avoids collision with tripmate_frontend on port 80)
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - edustream-net

# ── Persistent Storage Volumes ──────────────────────────────────
volumes:
  mongo_data:
  redis_data:
  rabbitmq_data:

# ── Shared Network ──────────────────────────────────────────────
networks:
  edustream-net:
    driver: bridge
